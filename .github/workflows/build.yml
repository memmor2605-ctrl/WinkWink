name: Build WinkWink APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Adres backendu (HTTPS). Opcjonalnie ustaw w Settings → Secrets and variables → Actions → Variables.
      WINKWINK_API_BASE_URL: ${{ vars.WINKWINK_API_BASE_URL || 'https://api.winkwink.example' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wypakuj projekt z ZIP
        run: |
          set -e
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Używam: $ZIP"
          rm -rf src_unzipped && mkdir src_unzipped
          unzip -q "$ZIP" -d src_unzipped
          ROOT=$(find src_unzipped -type f -name settings.gradle.kts -path '*android*' -print -quit | xargs dirname | xargs dirname)
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/$ROOT" >> "$GITHUB_ENV"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Android SDK (licencje + platforma 35)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Android — APK debug
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Wyniki — APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winkwink-debug-apk
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Wyniki — raporty błędów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: winkwink-reports
          path: ${{ env.PROJECT_ROOT }}/android/app/build/reports/**
          if-no-files-found: ignore
